# Test set for the lookalike assistant. AI only; nothing here is human-checked.
#
# new: posted after the model's training data (first version July 2026 or later). The main
#      test. No answer key; a physicist rates each flag (ratings/<id>.md), and
#      scripts/followup.py checks back for new versions, comments and replies.
# known: older papers whose later history is known. A sanity check only: the model may know
#      them, and the library was partly built from the papers that answer them. Each
#      answer-key entry is a lookalike id (or a short name when no entry exists) with the
#      source that establishes it.

